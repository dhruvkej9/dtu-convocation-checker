name: Keep Render App Alive

on:
  # Run every 10 minutes to keep the app warm
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  wakeup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Wake up Render App
        id: wakeup
        run: |
          echo "🚀 Pinging Render app health endpoint..."
          echo "⏰ Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          
          # Try to wake up the app with retries
          MAX_RETRIES=3
          RETRY_DELAY=10
          TIMEOUT=60
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo ""
            echo "📡 Attempt $i of $MAX_RETRIES..."
            
            # Use curl with extended timeout for cold starts
            HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" \
              --max-time $TIMEOUT \
              --retry 2 \
              --retry-delay 5 \
              "https://dtu-convocation-checker.onrender.com/health" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ App is alive! HTTP Status: $HTTP_CODE"
              echo "📄 Response:"
              cat response.txt
              echo ""
              echo "status=success" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "⚠️ HTTP Status: $HTTP_CODE"
              if [ -f response.txt ]; then
                echo "Response: $(cat response.txt)"
              fi
              
              if [ $i -lt $MAX_RETRIES ]; then
                echo "⏳ Waiting ${RETRY_DELAY}s before retry..."
                sleep $RETRY_DELAY
              fi
            fi
          done
          
          echo ""
          echo "❌ Failed to wake up app after $MAX_RETRIES attempts"
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1

      - name: Log Result
        if: always()
        run: |
          echo "========================================"
          echo "🏁 Wake-up job completed"
          echo "⏰ Completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "========================================"
